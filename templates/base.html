<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma Web{% endblock %}</title>
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Inclusión del componente reusable de navegación -->
    {% include 'components/navbar.html' %}

    <!-- Encabezado Principal -->
    <header class="bg-light text-center py-4 border-bottom">
        <div class="container">
            <h1 class="display-6 fw-bold text-primary">Plataforma para Diseñar Páginas Web</h1>
            <p class="lead text-secondary m-0">Integración de Bootstrap con Flask & Jinja2</p>
        </div>
    </header>

    <!-- Contenido Dinámico -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Inclusión del componente reusable de pie de página -->
    {% include 'components/footer.html' %}

    <!-- JavaScript de Bootstrap y Personalizado -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
